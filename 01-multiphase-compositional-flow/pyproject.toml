[project]
name = "cmfsim"
version = "0.1.0"
description = "Simulador composicional de escoamento bifásico em tubulações em regime permanente (reprodução moderna da dissertação de G. A. Carvalho, UERJ 2022)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ipykernel>=7.4.0",
    "jax>=0.11.2",
    "jsonschema>=4.26.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
cmfsim = "cmfsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmfsim", "generators", "dissertation", "surrogate"]
exclude = ["dissertation/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not nightly'"
markers = [
    "golden: compara com tests/golden",
    "nightly: lento; corre com -m nightly",
    "reference: precisa da biblioteca de referência termodinâmica (thermo)",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pymupdf>=1.28.2",
    "thermo>=0.4",
]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "notebooks/"
